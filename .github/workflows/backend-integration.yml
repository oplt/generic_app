name: Backend integration

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d app_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      object-storage:
        image: minio/minio:RELEASE.2025-02-28T09-55-16Z
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio-password
        ports: ["9000:9000", "9001:9001"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: 01234567890123456789012345678901
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CELERY_TASK_ALWAYS_EAGER: false
      RAG_VECTOR_BACKEND: pgvector
      RAG_EMBEDDING_PROVIDER: local
      RAG_EMBEDDING_DIMENSIONS: 1536
      REQUIRE_EMAIL_VERIFICATION: false
      STORAGE_BUCKET: generic-app-test
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_ACCESS_KEY: minio
      STORAGE_SECRET_KEY: minio-password
      STORAGE_USE_SSL: false
      STORAGE_PUBLIC_READ: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --project backend
      - run: uv run --project backend alembic upgrade head
      - run: uv run --project backend alembic check
      - run: uv run --project backend pytest -q backend/tests backend/modules
